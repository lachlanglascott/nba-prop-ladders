[project]
name = "nba-prop-ladders"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "nba_api>=1.5",
    "polars>=1.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "truststore>=0.10.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_ladders"]

[tool.ruff]
line-length = 100
